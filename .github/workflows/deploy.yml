name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/firestore-backup.yml'

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-962d2332-8a63-46b3-92e
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: cxr
  GCS_MODELS_BUCKET: cxr-model-artifacts-730619653471

jobs:
  changes:
    name: Detect deployment scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          if not base or set(base) == {'0'}:
              backend = frontend = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              common = any(p.startswith('.github/workflows/') or p in {'docker-compose.yml', 'docker-compose.yaml'} for p in paths)
              backend = common or any(p.startswith('backend/') for p in paths)
              frontend = common or any(p.startswith('frontend-next/') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'backend={str(backend).lower()}\nfrontend={str(frontend).lower()}\n')
          PY

  test:
    name: Tests + lint (gate)
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.backend == 'true'
    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/730619653471/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@project-962d2332-8a63-46b3-92e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Download model artifacts
        run: |
          mkdir -p backend/artifacts
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v1.pt backend/artifacts/sprint4ml_v1.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v2.pt backend/artifacts/sprint4ml_v2.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/ensemble_config.json backend/artifacts/ensemble_config.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/model_config_14.json backend/artifacts/model_config_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/thresholds_14.json backend/artifacts/thresholds_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/labels_14.json backend/artifacts/labels_14.json

      - name: Verify artifacts and generate model manifest
        run: python3 backend/model_manifest.py --artifacts-dir backend/artifacts --app-commit "${{ github.sha }}"

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy backend to Cloud Run
        env:
          CXR_DEPLOY_BACKEND_KEY: ${{ secrets.CXR_API_KEY }}
        run: |
          test -n "$CXR_DEPLOY_BACKEND_KEY" || { echo "Falta el secreto CXR_API_KEY"; exit 1; }
          python3 - <<'PY'
          import json, os
          config = {
              "CXR_CORS_ORIGINS": "http://localhost:3000", "CXR_RATE_LIMIT_PREDICT": "20/minute",
              "CXR_AUDIT_LOG_PATH": "logs/audit.jsonl", "CXR_REQUIRE_MODEL_MANIFEST": "true",
              "CXR_API_KEY": os.environ['CXR_DEPLOY_BACKEND_KEY'],
          }
          path = os.path.join(os.environ['RUNNER_TEMP'], 'cxr-backend-env.json')
          with open(path, 'w') as f:
              json.dump(config, f)
          os.chmod(path, 0o600)
          PY
          trap 'rm -f "$RUNNER_TEMP/cxr-backend-env.json"' EXIT
          gcloud run deploy cxr-backend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --no-cpu-throttling \
            --timeout 3600 \
            --concurrency 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8000 \
            --startup-probe "httpGet.path=/ready,httpGet.port=8000,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=24" \
            --env-vars-file "$RUNNER_TEMP/cxr-backend-env.json"

      - name: Read backend URL
        id: backend-url
        run: echo "url=$(gcloud run services describe cxr-backend --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Verify loaded backend
        env:
          CXR_DEPLOY_BACKEND_KEY: ${{ secrets.CXR_API_KEY }}
        run: |
          URL=$(gcloud run services describe cxr-backend --region ${{ env.REGION }} --format='value(status.url)')
          curl --fail --retry 5 --retry-delay 5 --max-time 30 "$URL/ready"
          python3 - <<'PY'
          import os, random, struct, zlib
          rng = random.Random(42)
          raw = b''.join(b'\0' + rng.randbytes(64) for _ in range(64))
          def chunk(name, data):
              return struct.pack('>I', len(data)) + name + data + struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 64, 64, 8, 0, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'cxr-smoke.png'), 'wb') as f:
              f.write(png)
          PY
          trap 'rm -f "$RUNNER_TEMP/cxr-smoke.png" "$RUNNER_TEMP/cxr-smoke.json"' EXIT
          curl --fail --max-time 180 -H "X-API-Key: $CXR_DEPLOY_BACKEND_KEY" -F "file=@$RUNNER_TEMP/cxr-smoke.png" "$URL/predict?include_gradcam=false" --output "$RUNNER_TEMP/cxr-smoke.json"
          python3 - <<'PY'
          import json, math, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'cxr-smoke.json')) as f:
              result = json.load(f)
          assert len(result['probabilities']) == 14
          assert all(math.isfinite(v) and 0 <= v <= 1 for v in result['probabilities'].values())
          assert len(result['thresholds_used']) == 14
          assert result['model_version'].startswith('ensemble:') and 'unverified' not in result['model_version']
          print('Inferencia tecnica sintetica verificada. No es una prueba de precision clinica.')
          PY

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [test, changes, deploy-backend]
    if: always() && needs.test.result == 'success' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/730619653471/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@project-962d2332-8a63-46b3-92e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ./frontend-next
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy frontend to Cloud Run
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CXR_DEPLOY_BACKEND_KEY: ${{ secrets.CXR_API_KEY }}
          CXR_DEPLOY_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          test -n "$SMTP_PASSWORD" || { echo "Falta el secreto SMTP_PASSWORD"; exit 1; }
          export CXR_DEPLOY_BACKEND_URL=$(gcloud run services describe cxr-backend --region ${{ env.REGION }} --format='value(status.url)')
          export CXR_DEPLOY_FRONTEND_URL=$(gcloud run services describe cxr-frontend --region ${{ env.REGION }} --format='value(status.url)' 2>/dev/null || true)
          python3 - <<'PY'
          import json, os
          config = {
              "HOSTNAME": "0.0.0.0", "BACKEND_URL": os.environ["CXR_DEPLOY_BACKEND_URL"],
              "AUTH_TRUST_HOST": "true",
              "DATA_BACKEND": "firestore", "GOOGLE_CLOUD_PROJECT": "${{ env.PROJECT_ID }}",
              "BACKEND_API_KEY": os.environ["CXR_DEPLOY_BACKEND_KEY"],
              "AUTH_SECRET": os.environ["CXR_DEPLOY_AUTH_SECRET"],
              "SMTP_USER": "Adcejuma@gmail.com", "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"],
          }
          if os.environ.get('CXR_DEPLOY_FRONTEND_URL'):
              config['AUTH_URL'] = os.environ['CXR_DEPLOY_FRONTEND_URL']
          path = os.path.join(os.environ["RUNNER_TEMP"], "cxr-frontend-env.json")
          with open(path, "w") as f:
              json.dump(config, f)
          os.chmod(path, 0o600)
          PY
          trap 'rm -f "$RUNNER_TEMP/cxr-frontend-env.json"' EXIT
          gcloud run deploy cxr-frontend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 4 \
            --min-instances 0 \
            --max-instances 3 \
            --port 3000 \
            --env-vars-file "$RUNNER_TEMP/cxr-frontend-env.json"

      - name: Update backend CORS origin
        run: |
          FRONTEND_URL=$(gcloud run services describe cxr-frontend --region ${{ env.REGION }} --format='value(status.url)')
          gcloud run services update cxr-frontend \
            --region ${{ env.REGION }} \
            --update-env-vars "AUTH_URL=${FRONTEND_URL}"
          ORIGINS=$(gcloud run services describe cxr-backend --region ${{ env.REGION }} --format=json | python3 -c "import json,sys; c=json.load(sys.stdin); print(next((e.get('value','') for e in c['spec']['template']['spec']['containers'][0].get('env',[]) if e['name']=='CXR_CORS_ORIGINS'),''))")
          if [ "$ORIGINS" != "$FRONTEND_URL" ]; then
            gcloud run services update cxr-backend --region ${{ env.REGION }} --update-env-vars "CXR_CORS_ORIGINS=${FRONTEND_URL}"
          fi

      - name: Verify public frontend pages
        run: |
          URL=$(gcloud run services describe cxr-frontend --region ${{ env.REGION }} --format='value(status.url)')
          curl --fail --retry 3 --max-time 30 "$URL/login" --output /dev/null
          curl --fail --retry 3 --max-time 30 "$URL/recover" --output /dev/null
