name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-20fbf8b2-6971-4ef9-8b1
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: cxr
  BACKEND_URL: https://cxr-backend-55733445282.us-central1.run.app
  FRONTEND_URL: https://cxr-frontend-55733445282.us-central1.run.app
  GCS_MODELS_BUCKET: cxr-model-artifacts-55733445282

jobs:
  test:
    name: Tests + lint (gate)
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Download model artifacts
        run: |
          mkdir -p backend/artifacts
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v1.pt backend/artifacts/sprint4ml_v1.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v2.pt backend/artifacts/sprint4ml_v2.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/ensemble_config.json backend/artifacts/ensemble_config.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/model_config_14.json backend/artifacts/model_config_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/thresholds_14.json backend/artifacts/thresholds_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/labels_14.json backend/artifacts/labels_14.json

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy cxr-backend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --no-cpu-throttling \
            --timeout 3600 \
            --concurrency 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8000 \
            --set-env-vars "CXR_CORS_ORIGINS=${{ env.FRONTEND_URL }},CXR_RATE_LIMIT_PREDICT=20/minute,CXR_AUDIT_LOG_PATH=logs/audit.jsonl,CXR_API_KEY=${{ secrets.CXR_API_KEY }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ./frontend-next
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy cxr-frontend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --port 3000 \
            --set-env-vars "HOSTNAME=0.0.0.0,BACKEND_URL=${{ env.BACKEND_URL }},AUTH_TRUST_HOST=true,AUTH_URL=${{ env.FRONTEND_URL }},BACKEND_API_KEY=${{ secrets.CXR_API_KEY }},AUTH_SECRET=${{ secrets.AUTH_SECRET }}"
