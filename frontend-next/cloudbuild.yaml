steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/project-962d2332-8a63-46b3-92e/cxr/frontend:latest'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/project-962d2332-8a63-46b3-92e/cxr/frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
