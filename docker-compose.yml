version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
      - CXR_CORS_ORIGINS=${CXR_CORS_ORIGINS:-http://localhost:3000}
      - CXR_RATE_LIMIT_PREDICT=${CXR_RATE_LIMIT_PREDICT:-20/minute}
      - CXR_AUDIT_LOG_PATH=${CXR_AUDIT_LOG_PATH:-logs/audit.jsonl}
      - CXR_API_KEY=${CXR_API_KEY:-dev-local-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend-next
    ports:
      - "3000:3000"
    volumes:
      - frontend-data:/app/data
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_API_KEY=${CXR_API_KEY:-dev-local-key}
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret-cambiar-en-produccion}
      - AUTH_TRUST_HOST=true
      # Sin AUTH_URL, el server standalone detecta el host como 0.0.0.0:3000
      # y los redirects de auth (p.ej. signout -> /login) apuntan a una URL muerta.
      - AUTH_URL=${AUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend-data:
