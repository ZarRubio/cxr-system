name: Deploy to Cloud Run

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-962d2332-8a63-46b3-92e
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: cxr
  GCS_MODELS_BUCKET: cxr-model-artifacts-730619653471

jobs:
  test:
    name: Tests + lint (gate)
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/730619653471/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@project-962d2332-8a63-46b3-92e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Download model artifacts
        run: |
          mkdir -p backend/artifacts
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v1.pt backend/artifacts/sprint4ml_v1.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/sprint4ml_v2.pt backend/artifacts/sprint4ml_v2.pt
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/ensemble_config.json backend/artifacts/ensemble_config.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/model_config_14.json backend/artifacts/model_config_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/thresholds_14.json backend/artifacts/thresholds_14.json
          gcloud storage cp gs://${{ env.GCS_MODELS_BUCKET }}/artifacts/labels_14.json backend/artifacts/labels_14.json

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy cxr-backend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --no-cpu-throttling \
            --timeout 3600 \
            --concurrency 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8000 \
            --set-env-vars "CXR_CORS_ORIGINS=http://localhost:3000,CXR_RATE_LIMIT_PREDICT=20/minute,CXR_AUDIT_LOG_PATH=logs/audit.jsonl,CXR_API_KEY=${{ secrets.CXR_API_KEY }}"

      - name: Read backend URL
        id: backend-url
        run: echo "url=$(gcloud run services describe cxr-backend --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/730619653471/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions@project-962d2332-8a63-46b3-92e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ./frontend-next
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy frontend to Cloud Run
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CXR_DEPLOY_BACKEND_KEY: ${{ secrets.CXR_API_KEY }}
          CXR_DEPLOY_AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          test -n "$SMTP_PASSWORD" || { echo "Falta el secreto SMTP_PASSWORD"; exit 1; }
          python3 - <<'PY'
          import json, os
          config = {
              "HOSTNAME": "0.0.0.0", "BACKEND_URL": "${{ needs.deploy-backend.outputs.backend_url }}",
              "AUTH_TRUST_HOST": "true",
              "DATA_BACKEND": "firestore", "GOOGLE_CLOUD_PROJECT": "${{ env.PROJECT_ID }}",
              "BACKEND_API_KEY": os.environ["CXR_DEPLOY_BACKEND_KEY"],
              "AUTH_SECRET": os.environ["CXR_DEPLOY_AUTH_SECRET"],
              "SMTP_USER": "Adcejuma@gmail.com", "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"],
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "cxr-frontend-env.json")
          with open(path, "w") as f:
              json.dump(config, f)
          os.chmod(path, 0o600)
          PY
          trap 'rm -f "$RUNNER_TEMP/cxr-frontend-env.json"' EXIT
          gcloud run deploy cxr-frontend \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --port 3000 \
            --env-vars-file "$RUNNER_TEMP/cxr-frontend-env.json"

      - name: Update backend CORS origin
        run: |
          FRONTEND_URL=$(gcloud run services describe cxr-frontend --region ${{ env.REGION }} --format='value(status.url)')
          gcloud run services update cxr-frontend \
            --region ${{ env.REGION }} \
            --update-env-vars "AUTH_URL=${FRONTEND_URL}"
          gcloud run services update cxr-backend \
            --region ${{ env.REGION }} \
            --update-env-vars "CXR_CORS_ORIGINS=${FRONTEND_URL}"
