version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts
    environment:
      - PYTHONUNBUFFERED=1
      - DRIVE_FILE_ID=${DRIVE_FILE_ID:-}
      - CXR_MODEL_CHECKPOINT=${CXR_MODEL_CHECKPOINT:-sprint3_model.pt}
      - CXR_CORS_ORIGINS=${CXR_CORS_ORIGINS:-*}
      - CXR_RATE_LIMIT_PREDICT=${CXR_RATE_LIMIT_PREDICT:-20/minute}
      - CXR_AUDIT_LOG_PATH=${CXR_AUDIT_LOG_PATH:-logs/audit.jsonl}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend-next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
